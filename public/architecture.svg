<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wishmaker-arch-title wishmaker-arch-desc">
  <title id="wishmaker-arch-title">WishMaker architecture</title>
  <desc id="wishmaker-arch-desc">Architecture diagram of WishMaker, a Next.js 16 app. A browser client reaches a React frontend, which calls Server Actions and API Routes; those connect to the Gemini API for AI features and MongoDB for wishes.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6F655E"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B05463"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F7A4E"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFF8F2"/>

  <path d="M 620 72 Q 500 100 344 132" fill="none" stroke="rgba(46,42,39,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
