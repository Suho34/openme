<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft diffuse drop shadow beneath the wax seal -->
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="14" stdDeviation="16" flood-color="#3A0D15" flood-opacity="0.45" />
    </filter>

    <!-- 3D wax seal spherical radial gradient matching reference -->
    <radialGradient id="waxDome" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#A23545" />
      <stop offset="35%" stop-color="#8C2634" />
      <stop offset="75%" stop-color="#691826" />
      <stop offset="100%" stop-color="#4E101C" />
    </radialGradient>
  </defs>

  <!-- 3D Circular Wax Seal Button -->
  <circle cx="256" cy="256" r="180" fill="url(#waxDome)" filter="url(#sealShadow)" />

  <!-- Centered Heart with White Outline & Pale Blush Fill -->
  <path
    d="M 256, 320
       C 214, 284 184, 258 184, 234
       C 184, 204 208, 192 232, 192
       C 244, 192 252, 198 256, 206
       C 260, 198 268, 192 280, 192
       C 304, 192 328, 204 328, 234
       C 328, 258 298, 284 256, 320 Z"
    fill="#E8D4D7"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
